name: AI QA & Observability CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pytest-qa-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full JEV / LangGraph / DeepEval / OTel QA test suite
        run: pytest tests/ -v
      - name: Execute deterministic audit artifact check
        run: python run_full_qa_audit.py
